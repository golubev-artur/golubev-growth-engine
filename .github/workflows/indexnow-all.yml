name: IndexNow - переобход всех страниц

# Запускается вручную. Берёт живой sitemap.xml, проверяет каждый адрес на месте
# и отправляет в IndexNow только те, что реально отдают 200. Адреса с другим кодом
# не отправляются и выводятся списком: звать робота на ошибку хуже, чем не звать.

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить все адреса из sitemap
        run: |
          curl -sS --fail --max-time 30 https://golubev-consulting.ru/sitemap.xml -o sitemap.xml
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's|<loc>||; s|</loc>||' > all.txt
          echo "адресов в sitemap: $(wc -l < all.txt)"

          : > ok.txt
          : > bad.txt
          while read -r URL; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "$URL" >> ok.txt
            else
              printf '%s %s\n' "$CODE" "$URL" >> bad.txt
            fi
          done < all.txt

          echo "отдают 200: $(wc -l < ok.txt)"
          echo "не 200:     $(wc -l < bad.txt)"
          if [ -s bad.txt ]; then
            echo "::warning::Не все адреса отдают 200 - их в IndexNow не отправляем:"
            cat bad.txt
          fi

          {
            echo "### Проверка адресов из sitemap"
            echo ""
            echo "- всего: $(wc -l < all.txt)"
            echo "- отдают 200: $(wc -l < ok.txt)"
            echo "- не 200: $(wc -l < bad.txt)"
            if [ -s bad.txt ]; then
              echo ""
              echo '```'
              cat bad.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Отправить в IndexNow (Яндекс + Bing)
        env:
          INDEXNOW_KEY: 1d7744ee576da47c8da7fa3bd5bacb55
        run: |
          # tee, а не только в сводку: ответ поисковиков должен быть виден и в логе
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request, urllib.error

          urls = [l.strip() for l in open("ok.txt") if l.strip()]
          key = os.environ["INDEXNOW_KEY"]
          payload = {
              "host": "golubev-consulting.ru",
              "key": key,
              "keyLocation": f"https://golubev-consulting.ru/{key}.txt",
              "urlList": urls,
          }
          data = json.dumps(payload).encode("utf-8")

          print("")
          print("### Отправка в IndexNow")
          print("")
          print(f"- адресов отправлено: {len(urls)}")
          print("")

          # Яндекс отбивает запросы без внятного User-Agent: без него соединение
          # обрывается без ответа. Плюс три попытки - эндпоинты бывают недоступны.
          import time
          headers = {
              "Content-Type": "application/json; charset=utf-8",
              "User-Agent": "golubev-consulting.ru IndexNow client (+https://golubev-consulting.ru)",
              "Accept": "*/*",
          }
          ok_any = False
          for endpoint in ("https://yandex.com/indexnow", "https://api.indexnow.org/indexnow"):
              result = None
              for attempt in (1, 2, 3):
                  req = urllib.request.Request(endpoint, data=data, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          result = f"HTTP {resp.status}"
                          ok_any = True
                          break
                  except urllib.error.HTTPError as e:
                      result = f"HTTP {e.code} ({e.reason})"
                      if e.code < 500:
                          break
                  except Exception as e:
                      result = f"ошибка: {e}"
                  if attempt < 3:
                      time.sleep(3 * attempt)
              print(f"- `{endpoint}` -> {result}")
          if not ok_any:
              print("")
              print("**Ни один эндпоинт не принял заявку.**")
          PY
