name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        # Ключ запасного канала отправки заявок (Web3Forms). Если секрет не
        # задан, запасной канал просто выключен и сборка проходит как обычно.
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: npm run build

      - name: Проверить, включён ли запасной канал заявок
        # Запасной канал включается ключом из секрета WEB3FORMS_KEY. Без этой
        # проверки факт включения остаётся на веру: ключ попадает в собранный
        # скрипт молча, и узнать об этом можно было бы только в момент аварии.
        # Сам ключ не печатаем - только есть он в сборке или нет.
        env:
          KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::Секрет WEB3FORMS_KEY не задан - запасной канал отправки заявок ВЫКЛЮЧЕН"
            echo "- запасной канал заявок: выключен (нет секрета WEB3FORMS_KEY)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -rqF "$KEY" dist/assets; then
            echo "запасной канал заявок включён: ключ попал в сборку"
            echo "- запасной канал заявок: включён, ключ в сборке" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Секрет WEB3FORMS_KEY задан, но ключ не попал в сборку - запасной канал работать не будет"
            exit 1
          fi

      - name: Detect new blog posts
        id: blog
        run: |
          DIFF=$(git diff HEAD~1 HEAD -- src/data/blog.ts || true)
          if echo "$DIFF" | grep -q '^\+.*slug:'; then
            SLUGS=$(echo "$DIFF" | grep '^\+.*slug:' | sed 's/.*slug: "\([^"]*\)".*/\1/' | head -5)
            echo "new_posts=true" >> $GITHUB_OUTPUT
            echo "slugs<<EOF" >> $GITHUB_OUTPUT
            echo "$SLUGS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "new_posts=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

    outputs:
      new_posts: ${{ steps.blog.outputs.new_posts }}
      slugs: ${{ steps.blog.outputs.slugs }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: needs.build.outputs.new_posts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID: "491832074"
        run: |
          SLUGS="${{ needs.build.outputs.slugs }}"
          for SLUG in $SLUGS; do
            TITLE=$(grep -A1 "slug: \"$SLUG\"" src/data/blog.ts | grep 'title:' | sed 's/.*title: "\([^"]*\)".*/\1/' | head -1)
            URL="https://golubev-consulting.ru/blog/${SLUG}"
            MSG=$(printf '📝 Новый пост опубликован на golubev-consulting.ru\n\n%s\n%s' "$TITLE" "$URL")
            # Текст уходит телом POST с urlencode: в строке запроса пробелы и кириллица
            # делали URL невалидным, и curl падал с кодом 3, не отправив сообщение.
            curl -sS --fail -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MSG}" \
              -o /dev/null -w 'telegram sendMessage: HTTP %{http_code}\n'
          done

  indexnow:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: needs.build.outputs.new_posts == 'true'
    steps:
      - name: Ждём, пока Pages начнёт отдавать новые страницы
        # Скрипт публикации на локальной машине пингует IndexNow сразу после
        # пуша, когда деплой ещё идёт - робот приходит на 404 и запоминает его.
        # Здесь пинг идёт после успешного деплоя плюс запас на раздачу по CDN.
        run: sleep 300

      - name: Пинг IndexNow (Яндекс + Bing)
        env:
          INDEXNOW_KEY: 1d7744ee576da47c8da7fa3bd5bacb55
        run: |
          FAILED=0
          for SLUG in ${{ needs.build.outputs.slugs }}; do
            URL="https://golubev-consulting.ru/blog/${SLUG}/"
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "проверка $URL -> HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::warning::$URL отдаёт $CODE - IndexNow не отправляем, иначе робот запомнит ошибку"
              FAILED=1
              continue
            fi
            # --http1.1 и User-Agent: без них Яндекс обрывает соединение
            # (HTTP/2 stream INTERNAL_ERROR либо ответ без тела).
            for ENDPOINT in https://yandex.com/indexnow https://api.indexnow.org/indexnow; do
              CODE=000
              for ATTEMPT in 1 2 3; do
                CODE=$(curl -sS --http1.1 --max-time 30 \
                  -A "golubev-consulting.ru IndexNow client (+https://golubev-consulting.ru)" \
                  --get "$ENDPOINT" \
                  --data-urlencode "url=$URL" \
                  --data-urlencode "key=$INDEXNOW_KEY" \
                  -o /dev/null -w '%{http_code}' || echo 000)
                case "$CODE" in 2*) break;; esac
                sleep $((ATTEMPT * 3))
              done
              echo "  $ENDPOINT -> HTTP $CODE"
              case "$CODE" in 2*) ;; *) echo "::warning::$ENDPOINT не принял $URL (HTTP $CODE)";; esac
            done
          done
          exit $FAILED
